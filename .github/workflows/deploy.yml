name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Vercel occasionally serves a stale/empty build for this project —
      # "vercel build" completes in well under 100ms with none of the
      # expected esbuild/vite output, and the resulting deployment 404s on
      # every route. It's intermittent and unrelated to --force/cache
      # flags (seen with and without both). Root cause not pinned down
      # from the CLI alone, so instead of trusting a single deploy, verify
      # the live site afterward and retry until it's actually healthy.
      - name: Deploy to Vercel (forced, verified, retried)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_6M6jo8FDcgWsmCbACZQ1YWdB
          VERCEL_PROJECT_ID: prj_CZeKkxKOFYIRfPy5Ze5lbzJRO8PO
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "::group::Deploy attempt $attempt"
            url=$(npx vercel@latest deploy --prod --force --token="$VERCEL_TOKEN" --yes | tail -1)
            echo "Deployed: $url"
            echo "::endgroup::"

            sleep 5
            root_code=$(curl -s -o /dev/null -w "%{http_code}" "https://riscov.vercel.app/")
            docs_code=$(curl -s -o /dev/null -w "%{http_code}" "https://riscov.vercel.app/docs")
            echo "Health check — root: $root_code, docs: $docs_code"

            if [ "$root_code" = "200" ] && [ "$docs_code" = "200" ]; then
              echo "Production verified healthy."
              exit 0
            fi

            echo "Deployment unhealthy, retrying..."
            sleep 10
          done

          echo "All $attempt attempts produced an unhealthy deployment."
          exit 1
