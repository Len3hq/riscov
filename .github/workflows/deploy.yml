name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: true
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_6M6jo8FDcgWsmCbACZQ1YWdB
      VERCEL_PROJECT_ID: prj_CZeKkxKOFYIRfPy5Ze5lbzJRO8PO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Root cause of the flakiness this works around: when asked to build
      # remotely, Vercel's zero-config @vercel/static-build sometimes never
      # actually invokes our build command — "vercel build" completes in
      # well under 100ms with no esbuild/vite output, and the deployment
      # 404s on every route. It's reproducible from a clean checkout with
      # --force and with no cache involved, so it isn't a caching issue.
      #
      # It reliably does NOT happen when the build command's output
      # (api/index.mjs, web/dist/) already exists on disk before "vercel
      # build" runs — Vercel then just packages what's there instead of
      # trying (and silently failing) to produce it. So: build for real
      # ourselves first, then hand Vercel the already-built output via
      # --prebuilt, which skips its remote build step entirely. Verified
      # against a from-scratch clone before relying on this in CI.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run vercel-build

      - name: Package build output for Vercel
        run: npx vercel@59.1.4 build --prod --yes --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        run: npx vercel@59.1.4 deploy --prebuilt --prod --force --yes --token="$VERCEL_TOKEN"

      - name: Verify production is live
        run: |
          sleep 5
          root_code=$(curl -s -o /dev/null -w "%{http_code}" "https://riscov.vercel.app/")
          docs_code=$(curl -s -o /dev/null -w "%{http_code}" "https://riscov.vercel.app/docs")
          echo "root: $root_code, docs: $docs_code"
          [ "$root_code" = "200" ] && [ "$docs_code" = "200" ]
